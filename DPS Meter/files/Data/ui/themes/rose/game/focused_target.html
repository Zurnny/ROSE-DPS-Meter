<rml>
    <head>
        <title>Selected target</title>
        <link type="text/rcss" href="../styles/html.css" />
        <link type="text/rcss" href="../styles/spritesheet_gauge.css" />
        <link type="text/rcss" href="../styles/gauge.css" />
        <link type="text/rcss" href="../styles/spritesheet_stateicon.css" />
        <link type="text/rcss" href="../styles/components.css" />
        <style>
            body { position: absolute; top: 50dp; left: 50%; width: 240dp; margin-left: -120dp; z-index: -20; pointer-events: none; }
            #focused-target-root.duel { margin-top: 50dp; }
            #target-name { font-size: 14dp; font-weight: 820; line-height: 20dp; max-height: 40dp; overflow: hidden; word-break: break-word; text-align: center; font-effect: outline(1dp black); }
            #target-statuses { width: 100%; }
            .target-status-icon { pointer-events: auto; }

            /* ---- DPS meter (add-on, filled in by the script below) ---- */
            /* DPS meter: plain outlined text under the HP bar, like the HP numbers
               (yellow labels, white numbers). The numbers are read-only text boxes
               that redraw their own text, so updating them every second never
               creates new text elements (which made the game log font warnings). */
            #sp-dps { display: none; margin: 2dp auto 0 auto; width: 280dp; height: 16dp; white-space: nowrap;
                      flex-direction: row; justify-content: center; align-items: center;
                      font-family: Nunito; font-weight: 800; font-size: 12dp; font-effect: outline(1dp black); }
            #sp-dps.active { display: flex; }
            .sp-dps-lbl { color: yellow; margin-right: 3dp; white-space: nowrap; flex-shrink: 0; font-effect: outline(1dp black); }
            .sp-dps-dot { color: rgb(170, 170, 170); margin: 0 3dp; flex-shrink: 0; font-effect: outline(1dp black); }
            .sp-dps-num {
                display: block; height: 16dp; padding: 0; margin: 0; flex-shrink: 0;
                decorator: none; background: transparent; border: 0;
                font-family: Nunito; font-weight: 800; font-size: 12dp; line-height: 16dp;
                color: white; font-effect: outline(1dp black); text-align: left;
                pointer-events: none; tab-index: none; image-color: rgb(255, 255, 255);
            }
            #sp-dps.done .sp-dps-num { color: rgb(150, 220, 110); }
            #sp-dps.paused .sp-dps-num { color: rgb(180, 180, 180); }
            #sp-dps-source { display: none; }
            /* Repeating 1 second timer: two identical animations swapped each time one ends */
            @keyframes sp-dps-tick-a { from { opacity: 0; } to { opacity: 0; } }
            @keyframes sp-dps-tick-b { from { opacity: 0; } to { opacity: 0; } }
            #sp-dps-timer { position: absolute; width: 1dp; height: 1dp; opacity: 0; animation: 1s sp-dps-tick-a; }
            #focused-target.sp-dps-off #sp-dps { display: none; }
@keyframes sp-switch-tick-a { from { opacity: 0; } to { opacity: 0; } }
@keyframes sp-switch-tick-b { from { opacity: 0; } to { opacity: 0; } }
#sp-switch-timer { position: absolute; width: 1dp; height: 1dp; opacity: 0; pointer-events: none; animation: 2s sp-switch-tick-a; }
        </style>
        <script>
-- DPS meter (add-on). The game gives the UI no damage numbers, so
-- this watches the target's HP once a second: HP lost = damage per second.
-- It measures damage TAKEN by your target, so in a party it includes your
-- party's hits too. It resets when you change target; when the target dies or
-- nobody has hit it for 8 seconds, the fight's totals stay on screen for as
-- long as the target window does.
pcall(function()
    local function el(id) return document:GetElementById(id) end
    local function num(n)
        local t = string.format('%.0f', n)
        local r = t:reverse():gsub('(%d%d%d)', '%1,'):reverse():gsub('^,', '')
        return r
    end
    local key, last_hp = nil, nil
    local fight = nil          -- {total, seconds, recent = {...}, idle, done}
    local flip = false
    -- The line is a read-only text box: only its value changes, so no new text
    -- elements are created each second (that caused font warnings in the log).
    local shown = nil
    -- each number sits in its own read-only text box, sized to its text
    local function put(id, text)
        local e = el(id)
        if not e or e:GetAttribute('sp-shown') == text then return end
        e:SetAttribute('value', text)
        e:SetAttribute('sp-shown', text)
        e.style.width = (#text * 7 + 2) .. 'dp'
    end
    -- time left until the kill: the target's HP now / damage per second so far
    local function left()
        if fight.done then return '0s' end
        if fight.idle >= 8 then return '-' end
        local avg = fight.total / math.max(1, fight.seconds)
        if not last_hp or avg <= 0 then return '-' end
        local secs = math.ceil(last_hp / avg)
        if secs >= 3600 then return '1h+' end
        if secs >= 60 then return math.floor(secs / 60) .. 'm ' .. (secs % 60) .. 's' end
        return secs .. 's'
    end
    local function render()
        local box = el('sp-dps')
        if not box then return end
        if not fight or fight.total <= 0 then box:SetClass('active', false); return end
        local recent = 0
        for _, d in ipairs(fight.recent) do recent = recent + d end
        local now = #fight.recent > 0 and recent / #fight.recent or 0
        local avg = fight.total / math.max(1, fight.seconds)
        put('sp-dps-now', num(now))
        put('sp-dps-avg', num(avg))
        put('sp-dps-time', left())
        box:SetClass('done', fight.done == true)              -- green: target defeated
        box:SetClass('paused', not fight.done and fight.idle >= 8)   -- grey: nobody has hit it for 8s
        box:SetClass('active', true)
    end
    local function tick()
        local src = el('sp-dps-values')
        if not src then return end
        local visible = src:GetAttribute('sp-visible') == '1'
        local hp, max = tonumber(src:GetAttribute('sp-hp')), tonumber(src:GetAttribute('sp-max'))
        local name = src:GetAttribute('sp-name') or ''
        if not visible or not hp or not max or max <= 0 then
            key, last_hp, fight = nil, nil, nil
            render(); return
        end
        local k = name .. '|' .. max
        if k ~= key then
            -- new target: start fresh
            key, last_hp, fight = k, hp, nil
            render(); return
        end
        local dealt = (last_hp or hp) - hp
        last_hp = hp
        if dealt > 0 then
            if not fight or fight.done then fight = {total = 0, seconds = 0, recent = {}, idle = 0} end
            fight.total = fight.total + dealt
            fight.idle = 0
        elseif fight then
            fight.idle = fight.idle + 1
        end
        if fight and not fight.done and fight.idle < 8 then
            fight.seconds = fight.seconds + 1
            table.insert(fight.recent, math.max(0, dealt))
            if #fight.recent > 3 then table.remove(fight.recent, 1) end   -- "DPS" = last 3 seconds
            if hp <= 0 then fight.done = true end
        end
        render()
    end
    local timer = el('sp-dps-timer')
    if timer then
        timer:AddEventListener('animationend', function()
            pcall(tick)
            flip = not flip
            timer.style.animation = '1s ' .. (flip and 'sp-dps-tick-b' or 'sp-dps-tick-a')
        end)
    end
end)
        </script>
    <script>
-- Add-on switch: turned on and off in Options > UI > Add-ons (Options Extras).
-- SP_ADDON_SWITCH dps_meter
-- When this window loads it lists itself in sp_addons_list.txt, which is how
-- Options knows to show its switch. The switch itself is saved in
-- sp_addons.txt; this window reads it fresh every 2 seconds, so a change in
-- Options shows here within about 2 seconds. Everything is on by default.
pcall(function()
    local LIST, FLAGS = 'sp_addons_list.txt', 'sp_addons.txt'
    -- key, class put on this window while it is switched off ('' = none), switch text, add-on
    local MINE = {{'dps_meter', 'sp-dps-off', 'DPS meter under the target', 'DPS Meter'}}
    SP_ADDON_ON = function(key)
        local on = true
        pcall(function()
            local f = io.open(FLAGS, 'r')
            if not f then return end
            for line in f:lines() do
                local k, v = line:match('^%s*([%w_]+)%s*=%s*(%d)')
                if k == key then on = (v == '1') end
            end
            f:close()
        end)
        return on
    end
    -- list myself (key|switch text|add-on), keeping everyone else's lines
    pcall(function()
        local lines, have, changed = {}, {}, false
        local f = io.open(LIST, 'r')
        if f then
            for line in f:lines() do
                local k = line:match('^([%w_]+)|')
                if k then lines[#lines + 1] = line; have[k] = line end
            end
            f:close()
        end
        for _, m in ipairs(MINE) do
            local want = m[1] .. '|' .. m[3] .. '|' .. m[4]
            if have[m[1]] ~= want then
                changed = true
                local put = false
                for i, line in ipairs(lines) do
                    if line:match('^([%w_]+)|') == m[1] then lines[i] = want; put = true end
                end
                if not put then lines[#lines + 1] = want end
            end
        end
        if changed then
            local w = io.open(LIST, 'w')
            if w then w:write(table.concat(lines, '\n'), '\n'); w:close() end
        end
    end)
    local doc = document
    local function apply()
        for _, m in ipairs(MINE) do
            if m[2] ~= '' then pcall(function() (doc:GetElementById('focused-target') or doc):SetClass(m[2], not SP_ADDON_ON(m[1])) end) end
        end
    end
    apply()
    doc:AddEventListener('show', function() pcall(apply) end)
    doc:AddEventListener('mouseover', function() pcall(apply) end)
    -- repeating 2 second check: two identical animations swapped each time one ends
    pcall(function()
        local timer = doc:GetElementById('sp-switch-timer')   -- the empty div at the end of the body
        local flip = false
        timer:AddEventListener('animationend', function()
            pcall(apply)
            flip = not flip
            timer.style.animation = '2s ' .. (flip and 'sp-switch-tick-b' or 'sp-switch-tick-a')
        end)
    end)
end)
    </script>
    </head>
    <body id="focused-target" onclick="ignore">
        <!-- The model binds on a child: a body-level model attaches after parsing, too late for data-for templates. -->
        <div id="focused-target-root" data-model="focused-target" data-if="visible" data-class-duel="duel">
            <div id="target-name" data-style-color="color">{{name}}</div>
            <gauge id="target-health" class="ui-vitals horizontal-sm-md red" animation-enabled="false" data-if="show_health" data-attr-gmax="max_hp" data-attr-gvalue="hp">
                <span><label id="value" /> / <label id="max" /></span>
            </gauge>
            <div id="sp-dps"><span class="sp-dps-lbl">DPS</span><input id="sp-dps-now" class="sp-dps-num" type="text" readonly="" value="" /><span class="sp-dps-dot">·</span><span class="sp-dps-lbl">Avg</span><input id="sp-dps-avg" class="sp-dps-num" type="text" readonly="" value="" /><span class="sp-dps-dot">·</span><span class="sp-dps-lbl">Kill in</span><input id="sp-dps-time" class="sp-dps-num" type="text" readonly="" value="" /></div>
            <div id="target-statuses" class="ui-status-icons">
                <span class="target-status-icon" data-for="status, index : statuses" data-attr-status-index="index"><img data-attr-sprite="status.sprite"/></span>
            </div>
        </div>
        <!-- DPS meter: hidden copy of the target's data for the script, plus its timer -->
        <div id="sp-dps-source" data-model="focused-target"><span id="sp-dps-values" data-attr-sp-visible="visible ? 1 : 0" data-attr-sp-name="name" data-attr-sp-hp="hp" data-attr-sp-max="max_hp"></span></div>
        <div id="sp-dps-timer"></div>
        <div id="sp-switch-timer"></div>
    </body>
</rml>
