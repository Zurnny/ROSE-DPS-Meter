[Mod]
Name=DPS Meter
Version=2.8
Author=Zurnny
Group=
Description=Shows DPS, average and a countdown to the kill under the target window. It measures the HP your target loses, so in a party it counts everyone's hits. Switch: Options > UI > Add-ons.\nAdd-on for the game's default UI and the Steampunk UI theme. Works on its own or together with any of the other add-ons: they share their Options page, each adding its own line. Each window checks which of the two is installed and uses its look.
Changes=Steampunk look: wider brass flanges on the HP, MP and EXP bars, and the HP/MP numbers keep clear of them.
Priority=5
UpdateUrl=https://raw.githubusercontent.com/Zurnny/ROSE-DPS-Meter/main/DPS%20Meter/manifest.txt
