Description=Shows DPS, average and a countdown to the kill under the target window. It measures the HP your target loses, so in a party it counts everyone's hits. Switch: Options > UI > Add-ons.\nAdd-on for the game's default UI. Works on its own or together with any of the other add-ons: they share their Options page, each adding its own line. The Steampunk UI theme already has this built in, so it isn't needed with Steampunk.
Changes=Brings its own switch in Options > UI > Add-ons (Options Extras no longer needed). Keeps the Ice UI's settings in sp_addons.txt.
Priority=5
